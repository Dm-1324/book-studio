how_to_play: |
  Find every word from the list in the grid. In this book every word reads
  the easy way: from left to right, or from top to bottom. There are no
  backwards words and no diagonals.

  Names with two parts, such as BLUE TIT, appear in the grid without the
  space: BLUETIT.

  Circle each word as you find it, then tick its box in the list. All the
  answers are at the back of the book.
back_page: |
  Thank you for choosing this book. We hope it brought a little birdsong
  to your day.
back_blurb: |
  Sixty extra-large-print word searches for anyone who loves watching
  birds at the feeder, in the garden or on a quiet walk.

  Every word reads the easy way, left to right or top to bottom, so you can
  relax and enjoy the hunt. Big, bold letters, one puzzle per page and all
  the answers at the back.

  A gentle, thoughtful gift for birdwatchers, parents and grandparents.
