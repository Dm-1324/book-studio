how_to_play: |
  Find every word from the list in the grid. In this book every word reads
  the easy way: from left to right, or from top to bottom. There are no
  backwards words and no diagonals.

  Names with two parts, such as BLUE JAY, appear in the grid without the
  space: BLUEJAY.

  Circle each word as you find it, then tick its box in the list. All the
  answers are at the back of the book.
back_page: |
  Thank you for choosing this book. We hope it brought a little birdsong
  to your day.
back_blurb: |
  From the chickadee at your feeder to the owl calling after dark, every page
  of Wings & Words opens a new corner of the bird world to explore.

  Sixty bright, full-color puzzles, each with a bird fact to enjoy once you've
  circled the last word. Perfect for a quiet morning, a long trip, or a gift
  for the bird lover in your life.
