how_to_play: |
  Find every word from the list in the grid. Words can run across, down or
  diagonally, and they can be written forwards or backwards.

  Words made of two or more parts, such as SQUARE LEG, appear in the grid
  without the space: SQUARELEG.

  Circle each word as you find it, then tick its box in the list. All the
  answers are at the back of the book, four puzzles to a page.
back_page: |
  Thank you for choosing this book. We hope it gave you many happy hours at
  the crease.
back_blurb: |
  Twenty large-print word searches for anyone who loves the game, from
  fielding positions and batting shots to tea intervals and rain delays.

  Big, bold letters on clean white pages are easy on the eyes. Words run in
  every direction to keep you guessing, and every answer is at the back.

  A thoughtful gift for cricket-loving parents, grandparents and friends.
